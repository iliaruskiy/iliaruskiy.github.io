<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexx — Где обитает</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #08090a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f3f6;
      --text-muted: #8b949e;

      --color-telegram: #229ED9;
      --color-github: #f0f6fc;
      --color-steam: #2a475e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: #050607;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      z-index: 2;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    @keyframes floatSmooth {
      0% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(25vw, -20vh) scale(1.25);
      }
      66% {
        transform: translate(-20vw, 25vh) scale(0.85);
      }
      100% {
        transform: translate(0, 0) scale(1);
      }
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
    }

    .avatar-anim,
    .title,
    .link-btn,
    .subtitle {
      opacity: 0;
      transform: translateY(25px);
      animation: fadeInUp 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .avatar-anim {
      animation-delay: 0.05s;
      margin-bottom: 20px;
    }

    .title {
      animation-delay: 0.15s;
    }

    .link-btn:nth-child(1) { animation-delay: 0.25s; }
    .link-btn:nth-child(2) { animation-delay: 0.35s; }
    .link-btn:nth-child(3) { animation-delay: 0.45s; }

    .subtitle {
      animation-delay: 0.55s;
    }

    .container.leaving .avatar-anim {
      animation: fadeOutUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 0s;
    }
    .container.leaving .title {
      animation: fadeOutUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.07s;
    }
    .container.leaving .link-btn:nth-child(1) {
      animation: fadeOutUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.14s;
    }
    .container.leaving .link-btn:nth-child(2) {
      animation: fadeOutUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.21s;
    }
    .container.leaving .link-btn:nth-child(3) {
      animation: fadeOutUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.28s;
    }
    .container.leaving .subtitle {
      animation: fadeOutUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.35s;
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.15));
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

    .avatar-wrapper::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid rgba(138, 43, 226, 0);
      box-shadow: 0 0 0 rgba(138, 43, 226, 0);
      transition: all 0.35s ease;
      pointer-events: none;
    }

    .avatar-wrapper:hover {
      transform: scale(1.04);
    }

    .avatar-wrapper:hover::after {
      border-color: rgba(138, 43, 226, 0.55);
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.45);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #161b22;
      display: block;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      background: linear-gradient(180deg, #ffffff 0%, #a3b0c2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .link-btn {
      position: relative;
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                  background 0.3s ease, 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .link-btn[data-brand="telegram"]:hover {
      border-color: rgba(34, 158, 217, 0.5);
      background: rgba(34, 158, 217, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 25px rgba(34, 158, 217, 0.15);
      transform: translateY(-2px) scale(1.015);
    }
    .link-btn[data-brand="telegram"]:hover .link-icon { fill: var(--color-telegram); }

    .link-btn[data-brand="github"]:hover {
      border-color: rgba(240, 246, 252, 0.4);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 25px rgba(255, 255, 255, 0.1);
      transform: translateY(-2px) scale(1.015);
    }
    .link-btn[data-brand="github"]:hover .link-icon { fill: var(--color-github); }

    .link-btn[data-brand="steam"]:hover {
      border-color: rgba(42, 71, 94, 0.8);
      background: rgba(27, 40, 56, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 25px rgba(42, 71, 94, 0.3);
      transform: translateY(-2px) scale(1.015);
    }
    .link-btn[data-brand="steam"]:hover .link-icon { fill: #2a475e; }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
      transition: fill 0.3s ease;
    }

    .arrow-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      transition: transform 0.3s ease, fill 0.3s ease;
    }

    .link-btn:hover .arrow-icon {
      fill: var(--text-main);
      transform: translateX(4px);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOutUp {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-30px);
      }
    }
  </style>
</head>
<body>

  <div class="bg-canvas" id="bg-canvas">
    <div class="bg-grid"></div>
  </div>

  <div class="container" id="container">
    <div class="avatar-anim">
      <div class="avatar-wrapper">
        <img id="tg-avatar" src="https://t.me/i/userpic/320/Rus_pon.jpg" alt="Vexx">
      </div>
    </div>

    <h1 class="title">Где обитает Vexx</h1>

    <div class="links-list">
      
      <a class="link-btn" data-brand="telegram" href="https://t.me/Rus_pon" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.67-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.05-.48-.82-.27-1.47-.42-1.42-.88.03-.24.36-.49.99-.75 3.88-1.69 6.47-2.8 7.78-3.34 3.7-1.54 4.47-1.81 4.97-1.82.11 0 .35.03.5.14.13.1.17.24.18.34-.01.06.01.24 0 .38z"/>
          </svg>
          <span>Telegram</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link-btn" data-brand="github" href="https://github.com/iliaruskiy" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
          </svg>
          <span>GitHub</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link-btn" data-brand="steam" href="https://steamcommunity.com/profiles/76561199832278429/" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.03 4.524 4.524s-2.03 4.524-4.524 4.524h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 12-5.373 12-12s-5.373-12-12-12zm-4.008 15.58c-.771 0-1.393.624-1.393 1.393 0 .77.622 1.393 1.393 1.393.769 0 1.392-.623 1.392-1.393 0-.769-.623-1.393-1.392-1.393zm10.003-6.67c0-1.248-1.013-2.262-2.262-2.262-1.249 0-2.262 1.014-2.262 2.262 0 1.249 1.013 2.262 2.262 2.262 1.249 0 2.262-1.013 2.262-2.262z"/>
          </svg>
          <span>Steam</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

    </div>

    <p class="subtitle">Vexx читается как Векс*</p>
  </div>

  <script>
    const tgImg = document.getElementById('tg-avatar');
    tgImg.onerror = function() {
      this.src = 'https://github.com/iliaruskiy.png';
    };

    const bgCanvas = document.getElementById('bg-canvas');
    const blobCount = 4;
    for (let i = 0; i < blobCount; i++) {
      const glow = document.createElement('div');
      const size = Math.floor(Math.random() * 25) + 45;
      const top = Math.floor(Math.random() * 80) - 10;
      const left = Math.floor(Math.random() * 80) - 10;
      const val = Math.floor(Math.random() * 180) + 75;
      const opacity = (Math.random() * 0.12 + 0.08).toFixed(3);
      const duration = Math.floor(Math.random() * 6) + 7;
      const direction = Math.random() > 0.5 ? 'alternate' : 'alternate-reverse';

      glow.style.cssText = `
        position: absolute;
        width: ${size}vw;
        height: ${size}vw;
        top: ${top}%;
        left: ${left}%;
        border-radius: 50%;
        filter: blur(90px);
        background: rgba(${val}, ${val}, ${val}, ${opacity});
        animation: floatSmooth ${duration}s ease-in-out infinite ${direction};
        pointer-events: none;
      `;
      bgCanvas.appendChild(glow);
    }

    const container = document.getElementById('container');
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        const target = this.getAttribute('target');
        
        container.classList.add('leaving');
        
        setTimeout(() => {
          if (target === '_blank') {
            window.open(href, '_blank');
            container.classList.remove('leaving');
          } else {
            window.location.href = href;
          }
        }, 750);
      });
    });
  </script>
</body>
</html>
