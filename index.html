<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка Vexx'а</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #08090a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f3f6;
      --text-muted: #8b949e;

      --color-telegram: #229ED9;
      --color-github: #f0f6fc;
      --color-steam: #2a475e;
      
      --spring-easing: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: #050607;
      overflow: hidden;
    }

    #particles-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      z-index: 2;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
    }

    .avatar-anim,
    .title,
    .link-btn,
    .subtitle {
      opacity: 0;
      transform: translateY(40px) scale(0.9);
      filter: blur(10px);
      animation: fadeInUp 0.9s var(--spring-easing) forwards;
    }

    .avatar-anim {
      animation-delay: 0.05s;
      margin-bottom: 20px;
    }

    .title {
      animation-delay: 0.15s;
    }

    .link-btn:nth-child(1) { animation-delay: 0.25s; }
    .link-btn:nth-child(2) { animation-delay: 0.35s; }
    .link-btn:nth-child(3) { animation-delay: 0.45s; }

    .subtitle {
      animation-delay: 0.55s;
    }

    /* Анимация ухода растянута для плавности под 1.9 секунды */
    .container.leaving .avatar-anim { animation: fadeOutUp 1.1s ease forwards 0s; }
    .container.leaving .title { animation: fadeOutUp 1.1s ease forwards 0.15s; }
    .container.leaving .link-btn:nth-child(1) { animation: fadeOutUp 1.1s ease forwards 0.3s; }
    .container.leaving .link-btn:nth-child(2) { animation: fadeOutUp 1.1s ease forwards 0.45s; }
    .container.leaving .link-btn:nth-child(3) { animation: fadeOutUp 1.1s ease forwards 0.6s; }
    .container.leaving .subtitle { animation: fadeOutUp 1.1s ease forwards 0.75s; }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.02), rgba(138, 43, 226, 0.4));
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      transition: transform 0.5s var(--spring-easing), box-shadow 0.5s ease;
      cursor: pointer;
    }

    .avatar-wrapper::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: linear-gradient(45deg, rgba(138, 43, 226, 0.6), transparent, rgba(34, 158, 217, 0.6));
      filter: blur(12px);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -1;
    }

    .avatar-wrapper:hover {
      transform: scale(1.1) rotate(3deg);
      box-shadow: 0 20px 40px rgba(138, 43, 226, 0.35);
    }

    .avatar-wrapper:hover::before {
      opacity: 1;
      animation: spinGlow 4s linear infinite;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #161b22;
      display: block;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      background: linear-gradient(270deg, #ffffff, #a3b0c2, #8a2be2, #ffffff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: fadeInUp 0.9s var(--spring-easing) forwards, 
                 glowShift 6s ease infinite, 
                 floatTitle 3s ease-in-out infinite;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .link-btn {
      position: relative;
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 4px 20px rgba(0,0,0,0.2);
      transition: transform 0.4s var(--spring-easing), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .link-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 20%;
      height: 200%;
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(30deg);
      transition: transform 0.6s ease;
      pointer-events: none;
    }

    .link-btn:hover::after {
      transform: translate(500%, 0) rotate(30deg);
    }

    .link-btn:active {
      transform: scale(0.96) translateY(0) !important;
      transition-duration: 0.1s;
    }

    .link-btn[data-brand="telegram"]:hover {
      border-color: rgba(34, 158, 217, 0.6);
      background: rgba(34, 158, 217, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 12px 30px rgba(34, 158, 217, 0.3);
      transform: translateY(-4px) scale(1.02);
    }
    .link-btn[data-brand="telegram"]:hover .link-icon { fill: var(--color-telegram); transform: scale(1.15) rotate(-5deg); }

    .link-btn[data-brand="github"]:hover {
      border-color: rgba(240, 246, 252, 0.5);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 12px 30px rgba(255, 255, 255, 0.15);
      transform: translateY(-4px) scale(1.02);
    }
    .link-btn[data-brand="github"]:hover .link-icon { fill: var(--color-github); transform: scale(1.15) rotate(5deg); }

    .link-btn[data-brand="steam"]:hover {
      border-color: rgba(42, 71, 94, 0.9);
      background: rgba(27, 40, 56, 0.7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 12px 30px rgba(42, 71, 94, 0.4);
      transform: translateY(-4px) scale(1.02);
    }
    .link-btn[data-brand="steam"]:hover .link-icon { fill: #4a90e2; transform: scale(1.15) rotate(-5deg); }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
      transition: transform 0.4s var(--spring-easing), fill 0.3s ease;
    }

    .arrow-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      transition: transform 0.4s var(--spring-easing), fill 0.3s ease;
    }

    .link-btn:hover .arrow-icon {
      fill: var(--text-main);
      transform: translateX(6px) scale(1.2);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes fadeOutUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-40px) scale(0.9);
        filter: blur(10px);
      }
    }

    @keyframes spinGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes glowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatTitle {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 0px rgba(138, 43, 226, 0)); }
      50% { transform: translateY(-3px); filter: drop-shadow(0 4px 12px rgba(138, 43, 226, 0.4)); }
    }
  </style>
</head>
<body>

  <div class="bg-canvas" id="bg-canvas">
    <canvas id="particles-canvas"></canvas>
    <div class="bg-grid"></div>
  </div>

  <div class="container" id="container">
    <div class="avatar-anim">
      <div class="avatar-wrapper">
        <img id="tg-avatar" src="https://t.me/i/userpic/320/Rus_pon.jpg" alt="Vexx">
      </div>
    </div>

    <h1 class="title">Vexx</h1>

    <div class="links-list">
      
      <a class="link-btn" data-brand="telegram" href="https://t.me/Rus_pon" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.67-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.05-.48-.82-.27-1.47-.42-1.42-.88.03-.24.36-.49.99-.75 3.88-1.69 6.47-2.8 7.78-3.34 3.7-1.54 4.47-1.81 4.97-1.82.11 0 .35.03.5.14.13.1.17.24.18.34-.01.06.01.24 0 .38z"/>
          </svg>
          <span>Telegram</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link-btn" data-brand="github" href="https://github.com/iliaruskiy" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
          </svg>
          <span>GitHub</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="link-btn" data-brand="steam" href="https://steamcommunity.com/profiles/76561199832278429/" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.03 4.524 4.524s-2.03 4.524-4.524 4.524h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 12-5.373 12-12s-5.373-12-12-12zm-4.008 15.58c-.771 0-1.393.624-1.393 1.393 0 .77.622 1.393 1.393 1.393.769 0 1.392-.623 1.392-1.393 0-.769-.623-1.393-1.392-1.393zm10.003-6.67c0-1.248-1.013-2.262-2.262-2.262-1.249 0-2.262 1.014-2.262 2.262 0 1.249 1.013 2.262 2.262 2.262 1.249 0 2.262-1.013 2.262-2.262z"/>
          </svg>
          <span>Steam</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

    </div>

    <p class="subtitle">Vexx читается как Векс*</p>
  </div>

  <script>
    const tgImg = document.getElementById('tg-avatar');
    tgImg.onerror = function() {
      this.src = 'https://github.com/iliaruskiy.png';
    };

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let isLeaving = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
        this.y = canvas.height + Math.random() * 200;
        this.targetY = Math.random() * canvas.height;
        this.progress = 0;
        this.speed = Math.random() * 0.02 + 0.01;
        this.delay = Math.random() * 60; // Увеличен разброс задержек под длительность 1.9 с
        this.frame = 0;
      }
      
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.targetAlpha = Math.random() * 0.5 + 0.1;
        this.alpha = 0;
        // Замедлена разлетающаяся физика для ещё более затяжного ухода
        this.exitVx = (Math.random() - 0.5) * 4.5;
        this.exitVy = -(Math.random() * 3 + 1.5);
      }

      update() {
        this.frame++;
        
        if (isLeaving) {
          if (this.frame > this.delay) {
            this.x += this.exitVx;
            this.y += this.exitVy;
            this.alpha *= 0.975; // Мягкое длительное угасание
          }
        } else {
          if (this.alpha < this.targetAlpha) {
            this.alpha += 0.01;
          }
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.reset();
          }
        }
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 55; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Переходы по ссылкам
    const container = document.getElementById('container');
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        const target = this.getAttribute('target');
        
        container.classList.add('leaving');
        isLeaving = true;
        
        particles.forEach(p => p.frame = 0);

        // Переход ровно через 1900 мс (1.9 секунды)
        setTimeout(() => {
          if (target === '_blank') {
            window.open(href, '_blank');
            container.classList.remove('leaving');
            isLeaving = false;
            particles.forEach(p => p.reset());
          } else {
            window.location.href = href;
          }
        }, 1900);
      });
    });
  </script>
</body>
</html>
