<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexx — Где обитает</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f3f6;
      --text-muted: #8b949e;

      /* Цвета брендов */
      --color-telegram: #229ED9;
      --color-github: #f0f6fc;
      --color-steam: #2a475e; /* 4-й цвет с палитры */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* ФОН: Еле заметная медленная анимация */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      will-change: transform;
      opacity: 0.6;
    }

    .glow-1 {
      top: 15%;
      left: 15%;
      width: 45vw;
      height: 45vw;
      background: rgba(88, 166, 255, 0.08);
      animation: floatSmooth 24s ease-in-out infinite alternate;
    }

    .glow-2 {
      bottom: 15%;
      right: 15%;
      width: 50vw;
      height: 50vw;
      background: rgba(139, 92, 246, 0.07);
      animation: floatSmooth 30s ease-in-out infinite alternate-reverse;
    }

    .bg-lines {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, transparent 20%, var(--bg-color) 85%),
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
      animation: moveGrid 40s linear infinite;
    }

    @keyframes moveGrid {
      0% { background-position: 0 0, 0 0, 0 0; }
      100% { background-position: 0 0, 48px 48px, 48px 48px; }
    }

    @keyframes floatSmooth {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.05); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* Контейнер карточки */
    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
    }

    /* Аватарка с динамической градиентной обводкой */
    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 20px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.15));
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.1s;
      will-change: transform, opacity;
    }

    .avatar-wrapper::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: inherit;
      filter: blur(10px);
      opacity: 0.35;
      z-index: -1;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #161b22;
      display: block;
    }

    /* Заголовок */
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      color: var(--text-main);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.25s;
    }

    /* Список кнопок */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    /* Кнопка */
    .link-btn {
      position: relative;
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                  background 0.3s ease, 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      overflow: hidden;
    }

    .link-btn:nth-child(1) { animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.4s; }
    .link-btn:nth-child(2) { animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.52s; }
    .link-btn:nth-child(3) { animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.64s; }

    /* Наведение: Telegram */
    .link-btn[data-brand="telegram"]:hover {
      border-color: rgba(34, 158, 217, 0.5);
      background: rgba(34, 158, 217, 0.08);
      box-shadow: 0 8px 25px rgba(34, 158, 217, 0.15);
      transform: translateY(-2px) scale(1.015);
    }
    .link-btn[data-brand="telegram"]:hover .link-icon { fill: var(--color-telegram); }

    /* Наведение: GitHub */
    .link-btn[data-brand="github"]:hover {
      border-color: rgba(240, 246, 252, 0.4);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
      transform: translateY(-2px) scale(1.015);
    }
    .link-btn[data-brand="github"]:hover .link-icon { fill: var(--color-github); }

    /* Наведение: Steam (#2a475e и #1b2838) */
    .link-btn[data-brand="steam"]:hover {
      border-color: rgba(42, 71, 94, 0.8);
      background: rgba(27, 40, 56, 0.6);
      box-shadow: 0 8px 25px rgba(42, 71, 94, 0.3);
      transform: translateY(-2px) scale(1.015);
    }
    .link-btn[data-brand="steam"]:hover .link-icon { fill: #2a475e; }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
      transition: fill 0.3s ease;
    }

    .arrow-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      transition: transform 0.3s ease, fill 0.3s ease;
    }

    .link-btn:hover .arrow-icon {
      fill: var(--text-main);
      transform: translateX(4px);
    }

    /* Подпись */
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.78s;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Задний план: тонкая сетка + движения света -->
  <div class="bg-canvas">
    <div class="bg-lines"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
  </div>

    <!-- Аватарка из Telegram -->

    <!-- Заголовок -->
    <h1 class="title">Где обитает Vexx</h1>

      </a>

    </div>

    <!-- Текст-дисклеймер -->
    <p class="subtitle">Vexx читается как Векс*</p>
  </div>

  <script>
    // Запасной аватар
    const tgImg = document.getElementById('tg-avatar');
    tgImg.onerror = function() {
      this.src = 'https://github.com/iliaruskiy.png';
    };
  </script>
</body>
</html>
